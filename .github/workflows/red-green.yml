name: Red-green

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  red-green:
    # The first `test:` commit must fail `cargo test`; the PR head must pass.
    name: Red-then-green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's own head, not GitHub's merge commit, so its commits can be walked.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so the PR's commits can be listed against the base branch.
          fetch-depth: 0

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Check red-then-green
        env:
          # Passed via env, not inlined, so a branch name can't inject shell code.
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/red-green.sh "origin/$BASE_REF"
